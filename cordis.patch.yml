# @local/dsh-web-search-brave bundle patch.
#
# Two entries, in layer order (later bundle layers override earlier ones, and
# the profile user patch overrides everything):
#
# 1. Insert this plugin with default config. Do NOT put a real subscription
#    token here: this file is committed to git. Fill the token in through the
#    Plugins page form (web-search-brave → 配置), or paste it in the profile
#    user patch layer (~/.dsh/profiles/web/cordis.patch.yml):
#
#      - id: web-search-brave
#        config:
#          apiKey: <your-token>
#
# 2. Pin the web seam's searchProvider to brave. dsh-base already pins
#    `searchProvider: deepseek-official` on the `web` instance, so installing
#    this provider alone is not enough — this later-layer override wins while
#    the bundle is listed. To switch back (or to another provider), override
#    `id: web` again in the profile user patch, or unset the pin and let the
#    Web search settings page manage selection. $DSH_WEB_SEARCH_PROVIDER=brave
#    at launch is an equivalent runtime override.
#
#    `fetchProvider: http` MUST be restated: an override replaces the complete
#    config object, so omitting it would leave fetchProvider unset — and with
#    two fetch providers registered (http, deepseek-fetch-api) every web_fetch
#    would then fail with WEB_PROVIDER_AMBIGUOUS. This keeps dsh-base's local
#    HTTP fetch selection; override it in the user patch to change it.
- insert:
    - id: web-search-brave
      name: '@local/dsh-web-search-brave'
      config:
        apiKey: ''
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: brave
    fetchProvider: http
